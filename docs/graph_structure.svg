<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .graph-box { fill: #e8f5e8; stroke: #2e7d32; stroke-width: 1; }
      .node-box { fill: #fce4ec; stroke: #c2185b; stroke-width: 1; }
      .transition-box { fill: #f9fbe7; stroke: #689f38; stroke-width: 1; }
      .text-title { font-family: Arial; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .text-content { font-family: Arial; font-size: 11px; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .cardinality { font-family: Arial; font-size: 10px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Graph Class -->
  <g>
    <rect class="graph-box" x="40" y="40" width="280" height="160" rx="5"/>
    <text class="text-title" x="180" y="60">Graph</text>
    <line x1="50" y1="70" x2="310" y2="70" stroke="#2e7d32"/>
    <text class="text-content" x="50" y="90">- nodes_: map&lt;uint64_t, Node*&gt;</text>
    <text class="text-content" x="50" y="105">- initial_node_: uint64_t</text>
    <text class="text-content" x="50" y="120">- name_: string</text>
    <line x1="50" y1="130" x2="310" y2="130" stroke="#2e7d32"/>
    <text class="text-content" x="50" y="150">+ addNode(Node*): bool</text>
    <text class="text-content" x="50" y="165">+ getNode(uint64_t): Node*</text>
    <text class="text-content" x="50" y="180">+ getInitialNode(): Node*</text>
    <text class="text-content" x="50" y="195">+ toDot(): string</text>
  </g>
  
  <!-- Node Class -->
  <g>
    <rect class="node-box" x="400" y="40" width="280" height="180" rx="5"/>
    <text class="text-title" x="540" y="60">Node</text>
    <line x1="410" y1="70" x2="670" y2="70" stroke="#c2185b"/>
    <text class="text-content" x="410" y="90">- id_: uint64_t</text>
    <text class="text-content" x="410" y="105">- name_: string</text>
    <text class="text-content" x="410" y="120">- depth_: int</text>
    <text class="text-content" x="410" y="135">- transitions_: vector&lt;Transition*&gt;</text>
    <text class="text-content" x="410" y="150">- parents_: vector&lt;uint64_t&gt;</text>
    <line x1="410" y1="160" x2="670" y2="160" stroke="#c2185b"/>
    <text class="text-content" x="410" y="180">+ getId(): uint64_t</text>
    <text class="text-content" x="410" y="195">+ isFinal(): bool</text>
    <text class="text-content" x="410" y="210">+ addTransition(Transition*): bool</text>
  </g>
  
  <!-- Transition Class -->
  <g>
    <rect class="transition-box" x="400" y="280" width="280" height="140" rx="5"/>
    <text class="text-title" x="540" y="300">Transition</text>
    <line x1="410" y1="310" x2="670" y2="310" stroke="#689f38"/>
    <text class="text-content" x="410" y="330">- observation_: Observation*</text>
    <text class="text-content" x="410" y="345">- next_node_id_: uint64_t</text>
    <text class="text-content" x="410" y="360">- constraints_: set&lt;int&gt;</text>
    <line x1="410" y1="370" x2="670" y2="370" stroke="#689f38"/>
    <text class="text-content" x="410" y="390">+ getObservation(): Observation*</text>
    <text class="text-content" x="410" y="405">+ getNextNodeId(): uint64_t</text>
  </g>
  
  <!-- Arrows and Cardinality -->
  <line class="arrow" x1="320" y1="120" x2="400" y2="120"/>
  <text class="cardinality" x="350" y="115">1..*</text>
  
  <line class="arrow" x1="540" y1="220" x2="540" y2="280"/>
  <text class="cardinality" x="550" y="250">0..*</text>
  
  <text x="360" y="30" class="text-title" style="font-size: 16px;">Graph Structure Diagram</text>
</svg>